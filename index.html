<!DOCTYPE html>
<html lang="sq">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GashiQeramik</title>
    <style>
      :root {
        --bg: #f8f4ee;
        --card: #fffdfb;
        --text: #1f1b18;
        --muted: #5c524d;
        --accent: #b7783d;
        --accent-dark: #8e5d2b;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, #f7f1e9 0%, #f5efe9 100%);
        color: var(--text);
      }
      .container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
      }
      .card {
        max-width: 760px;
        width: 100%;
        background: var(--card);
        border: 1px solid rgba(183,120,61,0.2);
        border-radius: 20px;
        box-shadow: 0 20px 50px rgba(66, 42, 22, 0.08);
        padding: 48px 40px;
        text-align: center;
      }
      .badge {
        display: inline-block;
        background: rgba(183,120,61,0.12);
        color: var(--accent-dark);
        border: 1px solid rgba(183,120,61,0.25);
        padding: 8px 14px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: bold;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      h1 {
        font-size: clamp(2.2rem, 4vw, 4rem);
        margin: 22px 0 16px;
        line-height: 1.1;
      }
      p {
        margin: 0 auto;
        max-width: 560px;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.7;
      }
      .cta {
        margin-top: 28px;
        display: inline-block;
        background: var(--accent);
        color: white;
        text-decoration: none;
        border-radius: 999px;
        padding: 14px 24px;
        font-weight: 600;
        transition: 0.2s ease;
      }
      .cta:hover {
        background: var(--accent-dark);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <div class="badge">GashiQeramik</div>
        <h1>Mirë se vini në GashiQeramik</h1>
        <p>
          Ky është faqja e publikuar me GitHub Pages. Repoja është e gatshme dhe faqja
          përmban një faqe bazë të vendosur për t'u shfaqur publikisht.
        </p>
        <a class="cta" href="https://github.com/Mendimish1/GashiQeramik" target="_blank" rel="noreferrer">
          Shiko repo-n
        </a>
      </div>
    </div>
  </body>
</html>
